[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pagrus-age"
version = "0.1.0"
description = "Predict scale-read age of Pagrus pagrus from dockside measurements (southern Brazil, 1976-1985)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
  "scikit-learn>=1.6",
  "scipy>=1.11",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["httpx>=0.27", "mypy>=1.8", "pytest>=8", "pytest-cov>=5", "ruff>=0.4", "types-PyYAML"]

[project.scripts]
pagrus-age = "pagrus_age.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pagrus_age --cov-report=term-missing"
markers = ["slow: end-to-end pipeline tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]
ignore = ["PD011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src"]
